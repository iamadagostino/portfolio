allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  canvas: true
  esbuild: true
  postinstall-postinstall: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Migrated from the package.json "pnpm" field, which pnpm 11+ no longer reads.
overrides:
  abab: '>=2.0.6'
  are-we-there-yet: '>=2.0.0'
  domexception: '>=4.0.0'
  gauge: '>=3.0.2'
  glob: '>=7.2.3'
  inflight: '>=1.0.6'
  npmlog: '>=5.0.1'
  q: '>=1.5.1'
  rimraf: '>=2.6.3'

allowedDeprecatedVersions:
  abab: '*'
  are-we-there-yet: '*'
  domexception: '*'
  gauge: '*'
  glob: '*'
  inflight: '*'
  npmlog: '*'
  q: '*'
  rimraf: '*'
